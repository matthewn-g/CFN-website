<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Bar chart illustration -->
  <rect x="140" y="260" width="60" height="120" rx="4" fill="#8B5CF6" opacity="0.7"/>
  <rect x="220" y="200" width="60" height="180" rx="4" fill="#8B5CF6" opacity="0.5"/>
  <rect x="300" y="230" width="60" height="150" rx="4" fill="#8B5CF6" opacity="0.7"/>
  <rect x="380" y="180" width="60" height="200" rx="4" fill="#C9A84C" opacity="0.8"/>
  <rect x="460" y="210" width="60" height="170" rx="4" fill="#C9A84C" opacity="0.6"/>
  <rect x="540" y="170" width="60" height="210" rx="4" fill="#C9A84C" opacity="0.8"/>
  <!-- Label -->
  <text x="400" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#C9A84C" opacity="0.9" text-anchor="middle">ETFs</text>
  <text x="400" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#ffffff" opacity="0.5" text-anchor="middle">vs Mutual Funds</text>
</svg>
