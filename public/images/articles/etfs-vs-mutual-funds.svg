<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071828"/>
      <stop offset="100%" style="stop-color:#0D2B55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Bottom accent rule -->
  <rect x="0" y="444" width="800" height="6" fill="#FFDF01" opacity="0.6"/>

  <!-- Category + Title -->
  <text x="52" y="42" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.4" letter-spacing="3">FINANCIAL LITERACY</text>
  <text x="52" y="72" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="bold" fill="white" opacity="0.92" letter-spacing="1">ETFs vs. Mutual Funds</text>

  <!-- Chart frame -->
  <rect x="90" y="100" width="640" height="280" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Y-axis grid lines + labels -->
  <line x1="90" y1="100" x2="730" y2="100" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="90" y1="170" x2="730" y2="170" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="90" y1="240" x2="730" y2="240" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="90" y1="310" x2="730" y2="310" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="90" y1="380" x2="730" y2="380" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <text x="72" y="104" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="end">+20%</text>
  <text x="72" y="174" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="end">+15%</text>
  <text x="72" y="244" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="end">+10%</text>
  <text x="72" y="314" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="end"> +5%</text>
  <text x="72" y="384" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="end">  0%</text>

  <!-- X-axis labels -->
  <text x="120"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">JAN</text>
  <text x="213"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">FEB</text>
  <text x="306"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">MAR</text>
  <text x="399"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">APR</text>
  <text x="492"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">MAY</text>
  <text x="585"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">JUN</text>
  <text x="678"  y="400" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle">JUL</text>

  <!-- Mutual Fund line (white, lower performance) -->
  <polyline points="120,380 213,366 306,355 399,340 492,326 585,314 678,302" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Mutual Fund area fill -->
  <polygon points="120,380 213,366 306,355 399,340 492,326 585,314 678,302 678,380" fill="white" opacity="0.03"/>

  <!-- ETF line (gold, outperforming) -->
  <polyline points="120,380 213,358 306,336 399,306 492,270 585,232 678,186" fill="none" stroke="#FFDF01" stroke-width="2" stroke-opacity="0.9"/>
  <!-- ETF area fill -->
  <polygon points="120,380 213,358 306,336 399,306 492,270 585,232 678,186 678,380" fill="#FFDF01" opacity="0.04"/>

  <!-- End-point labels -->
  <text x="686" y="183" font-family="'Courier New',monospace" font-size="11" fill="#FFDF01" font-weight="bold">+18.2%</text>
  <text x="686" y="299" font-family="'Courier New',monospace" font-size="11" fill="white" opacity="0.5">+11.4%</text>

  <!-- Legend -->
  <line x1="90" y1="425" x2="115" y2="425" stroke="#FFDF01" stroke-width="2"/>
  <text x="120" y="429" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.6">ETF</text>
  <line x1="175" y1="425" x2="200" y2="425" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="205" y="429" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.4">MUTUAL FUND</text>
  <text x="730" y="429" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.25" text-anchor="end">YTD RETURN</text>
</svg>
