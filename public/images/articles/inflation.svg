<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Rising arrow illustration -->
  <polyline points="100,370 180,350 260,320 340,290 420,245 500,190 580,140 660,85" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-opacity="0.85"/>
  <!-- Arrow head -->
  <polygon points="660,85 640,100 648,115 680,90 660,65 648,80" fill="#EF4444" opacity="0.85"/>
  <!-- Area fill -->
  <polygon points="100,370 180,350 260,320 340,290 420,245 500,190 580,140 660,85 660,380 100,380" fill="#EF4444" opacity="0.07"/>
  <!-- Dollar signs -->
  <text x="200" y="230" font-family="Georgia, serif" font-size="32" fill="#C9A84C" opacity="0.25">$</text>
  <text x="380" y="180" font-family="Georgia, serif" font-size="32" fill="#C9A84C" opacity="0.25">$</text>
  <text x="540" y="130" font-family="Georgia, serif" font-size="32" fill="#C9A84C" opacity="0.2">$</text>
  <!-- Label -->
  <text x="400" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#EF4444" opacity="0.9" text-anchor="middle">INFLATION</text>
  <text x="400" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#ffffff" opacity="0.4" text-anchor="middle">Market Rundown</text>
</svg>
