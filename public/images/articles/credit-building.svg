<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Card illustration -->
  <rect x="220" y="130" width="360" height="210" rx="16" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="240" y="150" width="320" height="170" rx="12" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Chip -->
  <rect x="260" y="185" width="48" height="36" rx="6" fill="#C9A84C" opacity="0.7"/>
  <line x1="260" y1="200" x2="308" y2="200" stroke="#0D2B55" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="260" y1="210" x2="308" y2="210" stroke="#0D2B55" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="284" y1="185" x2="284" y2="221" stroke="#0D2B55" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Card number dots -->
  <circle cx="260" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="275" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="290" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="305" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="330" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="345" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="360" cy="255" r="4" fill="white" opacity="0.6"/>
  <circle cx="375" cy="255" r="4" fill="white" opacity="0.6"/>
  <text x="410" y="262" font-family="monospace" font-size="14" fill="white" opacity="0.7">4 2 1 9</text>
  <!-- Label -->
  <text x="400" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#06B6D4" opacity="0.9" text-anchor="middle">CREDIT</text>
  <text x="400" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#ffffff" opacity="0.4" text-anchor="middle">Building Your Score</text>
