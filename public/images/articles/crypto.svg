<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Bitcoin symbol -->
  <circle cx="400" cy="235" r="110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="400" cy="235" r="85" fill="#F59E0B" opacity="0.08"/>
  <!-- B letter stylised -->
  <text x="400" y="290" font-family="Georgia, serif" font-size="130" font-weight="bold" fill="#F59E0B" opacity="0.55" text-anchor="middle">₿</text>
  <!-- Candlestick hints -->
  <rect x="110" y="260" width="14" height="70" rx="2" fill="#10B981" opacity="0.5"/>
  <line x1="117" y1="240" x2="117" y2="260" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="117" y1="330" x2="117" y2="350" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="148" y="240" width="14" height="90" rx="2" fill="#EF4444" opacity="0.5"/>
  <line x1="155" y1="220" x2="155" y2="240" stroke="#EF4444" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="155" y1="330" x2="155" y2="355" stroke="#EF4444" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="628" y="250" width="14" height="80" rx="2" fill="#10B981" opacity="0.5"/>
  <line x1="635" y1="225" x2="635" y2="250" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="662" y="230" width="14" height="100" rx="2" fill="#EF4444" opacity="0.5"/>
  <line x1="669" y1="205" x2="669" y2="230" stroke="#EF4444" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Label -->
  <text x="400" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="bold" fill="#F59E0B" opacity="0.9" text-anchor="middle">CRYPTO</text>
  <text x="400" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#ffffff" opacity="0.4" text-anchor="middle">For Beginners</text>
</svg>
