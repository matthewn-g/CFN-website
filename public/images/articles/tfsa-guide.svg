<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Growth chart illustration -->
  <polyline points="120,340 200,310 280,280 360,240 440,190 520,150 600,105 680,80" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Area fill -->
  <polygon points="120,340 200,310 280,280 360,240 440,190 520,150 600,105 680,80 680,370 120,370" fill="#10B981" opacity="0.08"/>
  <!-- Dots on line -->
  <circle cx="120" cy="340" r="5" fill="#10B981" opacity="0.8"/>
  <circle cx="280" cy="280" r="5" fill="#10B981" opacity="0.8"/>
  <circle cx="440" cy="190" r="5" fill="#10B981" opacity="0.8"/>
  <circle cx="600" cy="105" r="5" fill="#10B981" opacity="0.8"/>
  <circle cx="680" cy="80" r="7" fill="#C9A84C"/>
  <!-- Label -->
  <text x="400" y="75" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#10B981" opacity="0.9" text-anchor="middle">TFSA</text>
  <text x="400" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#ffffff" opacity="0.45" text-anchor="middle">Tax-Free Savings Account</text>
</svg>
