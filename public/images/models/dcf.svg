<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Funnel / cash flow illustration -->
  <!-- Years timeline -->
  <line x1="120" y1="310" x2="680" y2="310" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Cash flow bars -->
  <rect x="140" y="220" width="70" height="90" rx="3" fill="#C9A84C" opacity="0.5"/>
  <rect x="240" y="200" width="70" height="110" rx="3" fill="#C9A84C" opacity="0.55"/>
  <rect x="340" y="175" width="70" height="135" rx="3" fill="#C9A84C" opacity="0.65"/>
  <rect x="440" y="150" width="70" height="160" rx="3" fill="#C9A84C" opacity="0.75"/>
  <rect x="540" y="125" width="70" height="185" rx="3" fill="#C9A84C" opacity="0.85"/>
  <!-- Discount arrows -->
  <line x1="620" y1="220" x2="400" y2="330" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="510" y1="220" x2="370" y2="330" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Labels -->
  <text x="175" y="340" font-family="monospace" font-size="11" fill="white" opacity="0.35" text-anchor="middle">Y1</text>
  <text x="275" y="340" font-family="monospace" font-size="11" fill="white" opacity="0.35" text-anchor="middle">Y2</text>
  <text x="375" y="340" font-family="monospace" font-size="11" fill="white" opacity="0.35" text-anchor="middle">Y3</text>
  <text x="475" y="340" font-family="monospace" font-size="11" fill="white" opacity="0.35" text-anchor="middle">Y4</text>
  <text x="575" y="340" font-family="monospace" font-size="11" fill="white" opacity="0.35" text-anchor="middle">TV</text>
  <!-- Title -->
  <text x="400" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#C9A84C" opacity="0.9" text-anchor="middle">DCF</text>
  <text x="400" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#ffffff" opacity="0.4" text-anchor="middle">Discounted Cash Flow</text>
</svg>
