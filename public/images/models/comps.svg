<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Spreadsheet / comps table illustration -->
  <!-- Header row -->
  <rect x="100" y="130" width="600" height="32" rx="4" fill="#06B6D4" opacity="0.25"/>
  <text x="200" y="151" font-family="monospace" font-size="12" fill="#06B6D4" opacity="0.9" text-anchor="middle">COMPANY</text>
  <text x="340" y="151" font-family="monospace" font-size="12" fill="#06B6D4" opacity="0.9" text-anchor="middle">EV/EBITDA</text>
  <text x="470" y="151" font-family="monospace" font-size="12" fill="#06B6D4" opacity="0.9" text-anchor="middle">P/E</text>
  <text x="590" y="151" font-family="monospace" font-size="12" fill="#06B6D4" opacity="0.9" text-anchor="middle">EV/REV</text>
  <!-- Data rows -->
  <rect x="100" y="164" width="600" height="28" rx="0" fill="#ffffff" opacity="0.03"/>
  <text x="200" y="182" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">Peer A</text>
  <text x="340" y="182" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">12.4x</text>
  <text x="470" y="182" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">22.1x</text>
  <text x="590" y="182" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">3.2x</text>

  <text x="200" y="212" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">Peer B</text>
  <text x="340" y="212" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">10.8x</text>
  <text x="470" y="212" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">19.4x</text>
  <text x="590" y="212" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">2.8x</text>

  <text x="200" y="242" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">Peer C</text>
  <text x="340" y="242" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">14.2x</text>
  <text x="470" y="242" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">25.7x</text>
  <text x="590" y="242" font-family="monospace" font-size="11" fill="white" opacity="0.55" text-anchor="middle">4.1x</text>

  <!-- Median row highlighted -->
  <rect x="100" y="254" width="600" height="28" rx="0" fill="#C9A84C" opacity="0.15"/>
  <text x="200" y="273" font-family="monospace" font-size="11" font-weight="bold" fill="#C9A84C" opacity="0.9" text-anchor="middle">Median</text>
  <text x="340" y="273" font-family="monospace" font-size="11" font-weight="bold" fill="#C9A84C" opacity="0.9" text-anchor="middle">12.4x</text>
  <text x="470" y="273" font-family="monospace" font-size="11" font-weight="bold" fill="#C9A84C" opacity="0.9" text-anchor="middle">22.1x</text>
  <text x="590" y="273" font-family="monospace" font-size="11" font-weight="bold" fill="#C9A84C" opacity="0.9" text-anchor="middle">3.2x</text>

  <!-- Target row -->
  <rect x="100" y="284" width="600" height="28" rx="0" fill="#06B6D4" opacity="0.1"/>
  <text x="200" y="303" font-family="monospace" font-size="11" fill="#06B6D4" opacity="0.85" text-anchor="middle">▶ Target</text>
  <text x="340" y="303" font-family="monospace" font-size="11" fill="#06B6D4" opacity="0.85" text-anchor="middle">—</text>
  <text x="470" y="303" font-family="monospace" font-size="11" fill="#06B6D4" opacity="0.85" text-anchor="middle">—</text>
  <text x="590" y="303" font-family="monospace" font-size="11" fill="#06B6D4" opacity="0.85" text-anchor="middle">—</text>

  <!-- Col dividers -->
  <line x1="270" y1="130" x2="270" y2="315" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="405" y1="130" x2="405" y2="315" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="535" y1="130" x2="535" y2="315" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <!-- Border -->
  <rect x="100" y="130" width="600" height="185" rx="4" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Title -->
  <text x="400" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#06B6D4" opacity="0.9" text-anchor="middle">COMPS</text>
  <text x="400" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#ffffff" opacity="0.4" text-anchor="middle">Comparable Company Analysis</text>
</svg>
