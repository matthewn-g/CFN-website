<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Three statement boxes -->
  <!-- Income Statement -->
  <rect x="90" y="145" width="175" height="220" rx="8" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="178" y="170" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#10B981" opacity="0.85" text-anchor="middle">INCOME STMT</text>
  <line x1="105" y1="178" x2="250" y2="178" stroke="#10B981" stroke-opacity="0.2" stroke-width="1"/>
  <text x="178" y="200" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">Revenue</text>
  <text x="178" y="220" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">– COGS</text>
  <text x="178" y="240" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">= Gross Profit</text>
  <text x="178" y="260" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">– OpEx</text>
  <text x="178" y="280" font-family="monospace" font-size="10" fill="#10B981" opacity="0.7" text-anchor="middle">= Net Income</text>
  <!-- Balance Sheet -->
  <rect x="313" y="145" width="175" height="220" rx="8" fill="#C9A84C" opacity="0.1" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="401" y="170" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#C9A84C" opacity="0.85" text-anchor="middle">BALANCE SHEET</text>
  <line x1="328" y1="178" x2="473" y2="178" stroke="#C9A84C" stroke-opacity="0.2" stroke-width="1"/>
  <text x="401" y="200" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">Assets</text>
  <text x="401" y="220" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">= Liabilities</text>
  <text x="401" y="240" font-family="monospace" font-size="10" fill="#C9A84C" opacity="0.7" text-anchor="middle">+ Equity</text>
  <!-- CF Statement -->
  <rect x="536" y="145" width="175" height="220" rx="8" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="624" y="170" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8B5CF6" opacity="0.85" text-anchor="middle">CASH FLOWS</text>
  <line x1="551" y1="178" x2="696" y2="178" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1"/>
  <text x="624" y="200" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">Operating</text>
  <text x="624" y="220" font-family="monospace" font-size="10" fill="white" opacity="0.4" text-anchor="middle">Investing</text>
  <text x="624" y="240" font-family="monospace" font-size="10" fill="#8B5CF6" opacity="0.7" text-anchor="middle">Financing</text>
  <!-- Arrows connecting them -->
  <line x1="265" y1="255" x2="313" y2="255" stroke="white" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="313,255 304,250 304,260" fill="white" opacity="0.2"/>
  <line x1="488" y1="255" x2="536" y2="255" stroke="white" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="536,255 527,250 527,260" fill="white" opacity="0.2"/>
  <!-- Title -->
  <text x="400" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#10B981" opacity="0.9" text-anchor="middle">FINANCIAL STATEMENTS</text>
  <text x="400" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#ffffff" opacity="0.4" text-anchor="middle">The Beginner's Roadmap</text>
</svg>
