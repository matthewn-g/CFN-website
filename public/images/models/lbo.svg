<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B55"/>
      <stop offset="100%" style="stop-color:#0a1f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Stacked debt/equity illustration -->
  <!-- Entry capital structure -->
  <text x="220" y="155" font-family="Georgia, serif" font-size="13" fill="white" opacity="0.4" text-anchor="middle">ENTRY</text>
  <!-- Debt stack -->
  <rect x="150" y="165" width="140" height="100" rx="4" fill="#8B5CF6" opacity="0.7"/>
  <text x="220" y="222" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">DEBT 70%</text>
  <!-- Equity -->
  <rect x="150" y="270" width="140" height="60" rx="4" fill="#C9A84C" opacity="0.8"/>
  <text x="220" y="307" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#0D2B55" text-anchor="middle">EQUITY 30%</text>
  <!-- Exit capital structure -->
  <text x="580" y="155" font-family="Georgia, serif" font-size="13" fill="white" opacity="0.4" text-anchor="middle">EXIT</text>
  <!-- Debt repaid (smaller) -->
  <rect x="510" y="165" width="140" height="55" rx="4" fill="#8B5CF6" opacity="0.5"/>
  <text x="580" y="198" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="white" opacity="0.8" text-anchor="middle">DEBT 35%</text>
  <!-- Equity grown -->
  <rect x="510" y="225" width="140" height="105" rx="4" fill="#C9A84C" opacity="0.85"/>
  <text x="580" y="285" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#0D2B55" text-anchor="middle">EQUITY 65%</text>
  <!-- Arrow between -->
  <line x1="295" y1="225" x2="505" y2="225" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="505,225 493,219 493,231" fill="white" opacity="0.25"/>
  <!-- IRR label -->
  <text x="400" y="215" font-family="monospace" font-size="12" fill="#10B981" opacity="0.7" text-anchor="middle">3.2x MoM</text>
  <text x="400" y="235" font-family="monospace" font-size="12" fill="#10B981" opacity="0.7" text-anchor="middle">28% IRR</text>
  <!-- Title -->
  <text x="400" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#8B5CF6" opacity="0.9" text-anchor="middle">LBO</text>
  <text x="400" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#ffffff" opacity="0.4" text-anchor="middle">Leveraged Buyout Model</text>
</svg>
