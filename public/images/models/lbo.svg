<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071828"/>
      <stop offset="100%" style="stop-color:#0D2B55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="444" width="800" height="6" fill="#FFDF01" opacity="0.6"/>
  <text x="52" y="42" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.4" letter-spacing="3">MODELS &amp; FRAMEWORKS</text>
  <text x="52" y="72" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="bold" fill="white" opacity="0.92">Leveraged Buyout (LBO) Model</text>
  <!-- Entry stack (left) -->
  <text x="230" y="105" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle" letter-spacing="2">ENTRY</text>
  <!-- Debt 70% of $500M = $350M (height prop to %) -->
  <!-- Total bar height: 220px. Debt=70%=154px, Equity=30%=66px -->
  <rect x="155" y="120" width="150" height="154" fill="white" opacity="0.12" rx="2"/>
  <rect x="155" y="120" width="150" height="2"   fill="white" opacity="0.4"/>
  <text x="230" y="144" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.45" text-anchor="middle">DEBT</text>
  <text x="230" y="160" font-family="'Courier New',monospace" font-size="14" fill="white" opacity="0.55" text-anchor="middle" font-weight="bold">70%</text>
  <text x="230" y="178" font-family="'Courier New',monospace" font-size="9" fill="white" opacity="0.3" text-anchor="middle">$350M</text>
  <!-- Equity 30% -->
  <rect x="155" y="274" width="150" height="66" fill="white" opacity="0.22" rx="2"/>
  <rect x="155" y="274" width="150" height="2"  fill="white" opacity="0.5"/>
  <text x="230" y="300" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.55" text-anchor="middle">EQUITY</text>
  <text x="230" y="318" font-family="'Courier New',monospace" font-size="14" fill="white" opacity="0.65" text-anchor="middle" font-weight="bold">30%</text>
  <!-- Bottom label -->
  <text x="230" y="360" font-family="'Courier New',monospace" font-size="9" fill="white" opacity="0.3" text-anchor="middle">TOTAL: $500M</text>

  <!-- Arrow between -->
  <line x1="320" y1="230" x2="480" y2="230" stroke="white" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="480,230 470,225 470,235" fill="white" opacity="0.2"/>
  <text x="400" y="222" font-family="'Courier New',monospace" font-size="8" fill="white" opacity="0.2" text-anchor="middle">5 YEARS</text>

  <!-- Exit stack (right, equity grew, debt shrank) -->
  <text x="570" y="105" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.35" text-anchor="middle" letter-spacing="2">EXIT</text>
  <!-- Exit EV = $850M, Debt paid down to $150M (18%), Equity = $700M (82%) -->
  <!-- Total height still 220px. Debt 18%=40px, Equity 82%=180px -->
  <rect x="495" y="120" width="150" height="40"  fill="white" opacity="0.12" rx="2"/>
  <rect x="495" y="120" width="150" height="2"   fill="white" opacity="0.4"/>
  <text x="570" y="144" font-family="'Courier New',monospace" font-size="10" fill="white" opacity="0.45" text-anchor="middle">DEBT 18%</text>
  <text x="570" y="160" font-family="'Courier New',monospace" font-size="9" fill="white" opacity="0.3" text-anchor="middle">$153M</text>
  <!-- Equity (gold) -->
  <rect x="495" y="160" width="150" height="180" fill="#FFDF01" opacity="0.12" rx="2"/>
  <rect x="495" y="160" width="150" height="2"   fill="#FFDF01" opacity="0.8"/>
  <text x="570" y="225" font-family="'Courier New',monospace" font-size="10" fill="#FFDF01" opacity="0.7" text-anchor="middle">EQUITY</text>
  <text x="570" y="245" font-family="'Courier New',monospace" font-size="22" fill="#FFDF01" opacity="0.85" text-anchor="middle" font-weight="bold">82%</text>
  <text x="570" y="268" font-family="'Courier New',monospace" font-size="9" fill="#FFDF01" opacity="0.5" text-anchor="middle">$697M</text>
  <text x="570" y="360" font-family="'Courier New',monospace" font-size="9" fill="white" opacity="0.3" text-anchor="middle">EXIT EV: $850M</text>

  <!-- Returns box -->
  <rect x="495" y="375" width="150" height="46" fill="none" stroke="#FFDF01" stroke-opacity="0.3" stroke-width="1" rx="3"/>
  <text x="520" y="394" font-family="'Courier New',monospace" font-size="9" fill="white" opacity="0.45">IRR</text>
  <text x="638" y="394" font-family="'Courier New',monospace" font-size="11" fill="#FFDF01" opacity="0.85" text-anchor="end" font-weight="bold">28.4%</text>
  <text x="520" y="412" font-family="'Courier New',monospace" font-size="9" fill="white" opacity="0.45">MOIC</text>
  <text x="638" y="412" font-family="'Courier New',monospace" font-size="11" fill="#FFDF01" opacity="0.85" text-anchor="end" font-weight="bold">4.6x</text>
</svg>
